<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাকা জমা দিন - 2XX BEt</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white font-sans pb-16">

    <header class="bg-[#1e1e1e] p-3 flex justify-between items-center border-b border-gray-800">
        <a href="index.html" class="text-yellow-500 font-bold">← ব্যাক</a>
        <h1 class="text-sm font-bold">ডিপোজিট (টাকা জমা)</h1>
        <span></span>
    </header>

    <div class="p-4 max-w-md mx-auto">
        <div class="bg-[#1e1e1e] p-4 rounded-lg border border-gray-800">
            
            <!-- Admin Controlled Number Display -->
            <div class="bg-gray-900 border border-yellow-600 p-3 rounded mb-3 text-center">
                <span class="text-xs text-gray-400">অ্যাডমিন প্রদত্ত নম্বর (<span id="adminTransType" class="text-yellow-400 font-bold">Send Money</span>):</span>
                <div id="adminDisplayNumber" class="text-md font-bold text-yellow-500 mt-1">01700000000</div>
            </div>

            <h2 class="text-xs text-gray-400 mb-2">পেমেন্ট মেথড সিলেক্ট করুন</h2>
            <div class="grid grid-cols-3 gap-2 mb-3">
                <button type="button" onclick="setMethod('বিকাশ', '01711111111')" class="bg-pink-600 p-2 rounded text-xs font-bold text-center">বিকাশ</button>
                <button type="button" onclick="setMethod('নগদ', '01822222222')" class="bg-orange-600 p-2 rounded text-xs font-bold text-center">নগদ</button>
                <button type="button" onclick="setMethod('রকেট', '01933333333')" class="bg-red-600 p-2 rounded text-xs font-bold text-center">রকেট</button>
            </div>

            <div class="mb-3">
                <label class="text-xs text-gray-400">লেনদেনের ধরণ (Type)</label>
                <select id="transTypeSelect" onchange="updateTransTypeLabel()" class="w-full bg-gray-900 border border-gray-700 p-2 rounded mt-1 text-xs text-white">
                    <option value="Send Money">Send Money</option>
                    <option value="Cash Out">Cash Out</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="text-xs text-gray-400">টাকার পরিমাণ (BDT)</label>
                <input type="number" id="depositAmount" placeholder="৫০০ - ২৫০০০" class="w-full bg-gray-900 border border-gray-700 p-2 rounded mt-1 text-sm text-white">
            </div>
            <div class="mb-3">
                <label class="text-xs text-gray-400">আপনার প্রেরক নম্বর</label>
                <input type="text" id="senderNumber" placeholder="01XXXXXXXXX" class="w-full bg-gray-900 border border-gray-700 p-2 rounded mt-1 text-sm text-white">
            </div>
            <div class="mb-4">
                <label class="text-xs text-gray-400">ট্রানজেকশন আইডি (TrxID)</label>
                <input type="text" id="trxId" placeholder="যেমন: 9L8K..." class="w-full bg-gray-900 border border-gray-700 p-2 rounded mt-1 text-sm text-white">
            </div>
            
            <button onclick="submitDeposit()" class="w-full bg-yellow-600 text-black font-bold py-2 rounded text-sm">ডিপোজিট কনফার্ম করুন</button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-[#1a1a1a] border-t border-gray-800 flex justify-around p-2 text-xs">
        <a href="index.html" class="text-gray-400 flex flex-col items-center">🏠 হোম</a>
        <a href="deposit.html" class="text-yellow-500 flex flex-col items-center">💳 জমা দিন</a>
        <a href="withdraw.html" class="text-gray-400 flex flex-col items-center">💸 উত্তোলন</a>
    </nav>

    <script>
        let currentMethod = 'বিকাশ';

        function setMethod(method, defaultNum) {
            currentMethod = method;
            document.getElementById('adminDisplayNumber').innerText = defaultNum;
        }

        function updateTransTypeLabel() {
            const type = document.getElementById('transTypeSelect').value;
            document.getElementById('adminTransType').innerText = type;
        }

        function submitDeposit() {
            const amount = document.getElementById('depositAmount').value;
            const sender = document.getElementById('senderNumber').value;
            const trx = document.getElementById('trxId').value;
            const type = document.getElementById('transTypeSelect').value;

            if(!amount || !sender || !trx) {
                alert('দয়া করে সব তথ্য সঠিকভাবে পূরণ করুন!');
                return;
            }

            // লোকাল স্টোরেজে ডিপোজিট রিকোয়েস্ট সেভ করার ব্যবস্থা
            const depositData = { method: currentMethod, type: type, amount: amount, sender: sender, trx: trx, time: new Date().toLocaleString() };
            let history = JSON.parse(localStorage.getItem('depositHistory')) || [];
            history.push(depositData);
            localStorage.setItem('depositHistory', JSON.stringify(history));

            alert(`আপনার ${currentMethod}-এর মাধ্যমে ${type} (${amount} টাকা) অনুরোধ সফলভাবে জমা হয়েছে!`);
            
            // ফর্ম ক্লিয়ার করা
            document.getElementById('depositAmount').value = '';
            document.getElementById('senderNumber').value = '';
            document.getElementById('trxId').value = '';
        }
    </script>
</body>
</html>
